[project]
name = "aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora: o modelo conduz a conversa e o código aplica as regras."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "google-adk[db]==2.9.1",
    "greenlet>=3.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.32",
]

[project.scripts]
api = "aurora.api:main"
restaurar = "aurora.restaurar:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
